apiVersion: v1
kind: Namespace
metadata:
  name: ai-k8s-ops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-k8s-ops
  namespace: ai-k8s-ops
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-k8s-ops-read-only
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "events", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-k8s-ops-read-only
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-k8s-ops-read-only
subjects:
  - kind: ServiceAccount
    name: ai-k8s-ops
    namespace: ai-k8s-ops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-k8s-ops-settings
  namespace: ai-k8s-ops
data:
  OLLAMA_MODEL: qwen3:0.6b
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-k8s-ops-targets
  namespace: ai-k8s-ops
data:
  targets.json: |
    {
      "targets": [
        {
          "name": "local-cluster",
          "prometheus_url": "http://prometheus-operated.monitoring.svc.cluster.local:9090",
          "loki_url": "http://loki.monitoring.svc.cluster.local:3100",
          "in_cluster": true
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-k8s-ops
  namespace: ai-k8s-ops
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ai-k8s-ops
  template:
    metadata:
      labels:
        app: ai-k8s-ops
    spec:
      serviceAccountName: ai-k8s-ops
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ai-k8s-ops:0.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: TARGETS_CONFIG
              value: /etc/ai-k8s-ops/targets.json
            - name: OLLAMA_HOST
              value: http://ollama.ai-k8s-ops.svc.cluster.local:11434
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ai-k8s-ops-settings
                  key: OLLAMA_MODEL
            - name: KUBECONFIG
              value: /etc/remote-kubeconfig/config
          volumeMounts:
            - name: targets
              mountPath: /etc/ai-k8s-ops
              readOnly: true
            - name: remote-kubeconfig
              mountPath: /etc/remote-kubeconfig
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: targets
          configMap:
            name: ai-k8s-ops-targets
        - name: remote-kubeconfig
          secret:
            secretName: ai-k8s-ops-kubeconfig
            optional: true
            items:
              - key: config
                path: config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-k8s-ops
  namespace: ai-k8s-ops
spec:
  type: ClusterIP
  selector:
    app: ai-k8s-ops
  ports:
    - name: http
      port: 8501
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ai-k8s-ops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-k8s-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: ollama/ollama:0.6.8
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ollama serve &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true' EXIT
              until ollama list >/dev/null 2>&1; do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  wait "$server_pid"
                  exit 1
                fi
                sleep 2
              done
              ollama pull "$OLLAMA_MODEL"
              wait "$server_pid"
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ai-k8s-ops-settings
                  key: OLLAMA_MODEL
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'ollama list | grep -Fq "$OLLAMA_MODEL"'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-k8s-ops
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      protocol: TCP
